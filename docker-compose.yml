services:
  mongodb:
    image: mongo:7
    container_name: shopforge_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: shopforge
    volumes:
      - mongo_data:/data/db
    networks:
      - shopforge_net

  mongo-express:
    image: mongo-express:1
    container_name: shopforge_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: shopforge123
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      - mongodb
    networks:
      - shopforge_net

volumes:
  mongo_data:
    driver: local

networks:
  shopforge_net:
    driver: bridge
